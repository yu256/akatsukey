packages:
 - 'packages/backend'
 - 'packages/frontend'
 - 'packages/sw'
 - 'packages/misskey-js'
 - 'packages/misskey-js/generator'
engineStrict: true
# Do not resolve versions published less than 7 days ago (supply-chain attack mitigation).
minimumReleaseAge: 10080
# Only for releases that have no 7-day-old alternative.
minimumReleaseAgeExclude:
  # The only release that supports sharp 0.35.
  - '@misskey-dev/sharp-read-bmp@2.0.0'
overrides:
  chokidar: 3.6.0
  fast-uri: 2.4.7
  lodash: 4.18.1
  # Keep jsonld 8's canonicalization behavior while patching its HTTP client.
  'undici@^5': 6.28.1
  # ip-cidr's address API is compatible with the patched parser.
  'ip-cidr>ip-address': 10.7.4
  # summaly otherwise retains an older Fastify patch release.
  '@misskey-dev/summaly>fastify': 5.12.7
allowBuilds:
  '@swc/core': true
  bufferutil: true
  cbor-extract: true
  cypress: true
  esbuild: true
  msgpackr-extract: true
  re2: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  '@nestjs/core': false
  '@parcel/watcher': false
  unrs-resolver: false
  msw: false
patchedDependencies:
  # DoS fix only; retain 0.24's emoji and mention behavior.
  # Upstream: https://github.com/misskey-dev/mfm.js/commit/7e3dda43ee86135fe1b8f6488b67e06972559ecb
  mfm-js@0.24.0: patches/mfm-js@0.24.0.patch
